<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6b4f">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>長榮哩程兌換卡</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone screen, no swiping — total on top, two bank tiles side by side with inline inputs, compact goal rows below */
:root{
  --bg:#eef2ef; --surface:#ffffff; --ink:#15231d; --muted:#5f6f67; --line:#d5ded9;
  --jade:#0f6b4f; --jade-soft:#dcefe6; --amber:#b9780f; --amber-soft:#f6ead2;
  --hsbc:#9a2b2b; --cube:#1f5aa6;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1613; --surface:#18221e; --ink:#e7efea; --muted:#9aaba2; --line:#2c3a34;
  --jade:#4fc59a; --jade-soft:#173328; --amber:#e3a645; --amber-soft:#33281a;
  --hsbc:#e07a6f; --cube:#7aa8eb; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1613; --surface:#18221e; --ink:#e7efea; --muted:#9aaba2; --line:#2c3a34;
  --jade:#4fc59a; --jade-soft:#173328; --amber:#e3a645; --amber-soft:#33281a;
  --hsbc:#e07a6f; --cube:#7aa8eb; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body)}
.wrap{max-width:460px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:12px 16px;display:flex;flex-direction:column;gap:10px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
/* total */
.total{display:flex;flex-direction:column;gap:8px}
.total-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.label{font-size:12px;color:var(--muted);letter-spacing:.06em}
.big{font-size:clamp(36px,11vw,48px);line-height:1.05;color:var(--jade);letter-spacing:-.02em}
.big small{font-family:var(--f-body);font-size:15px;color:var(--muted);font-weight:500;margin-left:4px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.split{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
.split span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}
.eva{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.eva input{font:inherit;font-family:var(--f-num);font-size:16px;font-weight:600;width:9.5em;max-width:55%;box-sizing:border-box;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-align:right}
.chip{font-size:12px;padding:4px 9px;border-radius:99px;font-weight:700;white-space:nowrap}
.ok{background:var(--jade-soft);color:var(--jade)} .warn{background:var(--amber-soft);color:var(--amber)}
/* banks */
.banks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bank{display:flex;flex-direction:column;gap:8px;min-width:0;border-top:3px solid var(--c)}
.bank h2{margin:0;font-size:14px;font-weight:700}
.bank h2 small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:1px}
.bank label{font-size:11px;color:var(--muted)}
.bank input{font:inherit;font-family:var(--f-num);font-size:17px;font-weight:600;width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-top:3px}
.bank .miles{font-size:24px;color:var(--c);line-height:1.1}
.bank .miles small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500;margin-left:3px}
.bank .meta{font-size:11.5px;color:var(--muted);line-height:1.55}
.bank .meta b{color:var(--ink);font-family:var(--f-num);font-weight:600}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
/* goals */
.goals{display:flex;flex-direction:column;gap:10px}
.goals-head{display:flex;justify-content:space-between;align-items:baseline}
.goals-head h2{margin:0;font-size:14px}
.goal{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline;font-size:13px}
.goal b{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal em{font-style:normal;font-size:12px;color:var(--muted);text-align:right}
.goal .bar{grid-column:1/-1;height:6px}
.goal .bar i{background:var(--jade)} .goal.short .bar i{background:var(--amber)}
.goal .gap{grid-column:1/-1;font-size:11.5px;color:var(--muted)}
.goal .qty{font-size:12px;margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--jade-soft);color:var(--jade)}
.goal.short .qty{background:var(--amber-soft);color:var(--amber)}
/* settings */
details{font-size:13px}
summary{cursor:pointer;color:var(--muted);padding:2px 0}
.set{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.set label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:3px;min-width:0}
.set input{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.set .full{grid-column:1/-1}
.foot{font-size:11px;color:var(--muted);text-align:center;margin:0}
</style>

</head>
<body>
<div class="wrap">
  <section class="panel total" aria-label="合計">
    <div class="total-top">
      <div>
        <div class="label">長榮哩程合計（現有＋可兌換）</div>
        <div class="big num" id="tMiles">0<small>哩</small></div>
      </div>
      <span class="chip warn" id="tChip">—</span>
    </div>
    <div class="bar" id="tBar"></div>
    <div class="split">
      <span style="--c:var(--jade)">長榮現有 <b class="num" id="tE">0</b></span>
      <span style="--c:var(--hsbc)">滙豐 <b class="num" id="tH">0</b></span>
      <span style="--c:var(--cube)">國泰 <b class="num" id="tC">0</b></span>
    </div>
    <label class="eva" for="inE">長榮帳戶目前哩程<input id="inE" type="number" inputmode="numeric" min="0"></label>
  </section>

  <div class="banks">
    <section class="panel bank" style="--c:var(--hsbc)">
      <h2>滙豐旅人卡<small id="hRate">1 點 = 1 哩</small></h2>
      <label for="inH">旅遊積分<input id="inH" type="number" inputmode="numeric" min="0"></label>
      <div class="miles num" id="hMiles">0<small>哩</small></div>
      <div class="meta">剩餘 <b id="hLeft">0</b> 點</div>
    </section>
    <section class="panel bank" style="--c:var(--cube)">
      <h2>國泰 CUBE<small id="cRate">360 點 = 1,000 哩</small></h2>
      <label for="inC">小樹點(信用卡)<input id="inC" type="number" inputmode="numeric" min="0"></label>
      <div class="miles num" id="cMiles">0<small>哩</small></div>
      <div class="meta">剩餘 <b id="cLeft">0</b> 點<br>再 <b id="cNeed">0</b> 點多換 1,000 哩</div>
    </section>
  </div>

  <section class="panel goals" aria-label="目標">
    <div class="goals-head"><h2>兌換目標</h2><span class="label" id="saved">範例數字</span></div>
    <div id="goals" class="goals"></div>
    <details>
      <summary>修改目標與兌換比例</summary>
      <div class="set">
        <label>目標 1<input id="goalName1" type="text"></label><label>所需哩數<input id="goalMiles1" type="number" min="0" inputmode="numeric"></label>
        <label>目標 2<input id="goalName2" type="text"></label><label>所需哩數<input id="goalMiles2" type="number" min="0" inputmode="numeric"></label>
        <label>目標 3<input id="goalName3" type="text"></label><label>所需哩數<input id="goalMiles3" type="number" min="0" inputmode="numeric"></label>
        <label>滙豐：幾點換 1 哩<input id="inHr" type="number" min="0.01" step="0.01"></label>
        <label>國泰：幾點換 1,000 哩<input id="inCr" type="number" min="1"></label>
      </div>
    </details>
  </section>
  <p class="foot">輸入後自動計算並記在這支手機。目標哩數請以長榮官網為準。· 版本 2026.10.21e</p>
</div>

<script>
const KEY="eva-miles-v2";
const DEFAULT={e:0,h:12000,c:8600,hr:1,cr:360,example:true,
  gv:3,goals:[{n:"東北亞升等",m:12000},{n:"東南亞升等",m:12000},{n:"歐美升等",m:50000}]};
let S={...DEFAULT};
try{
  const raw=localStorage.getItem(KEY);
  if(raw){S={...DEFAULT,...JSON.parse(raw)}}
  else{const old=localStorage.getItem("eva-miles-v1");
    if(old){const o=JSON.parse(old);S={...DEFAULT,h:o.h??DEFAULT.h,c:o.c??DEFAULT.c,hr:o.hr??1,cr:o.cr??360,example:!!o.example};}
    localStorage.setItem(KEY,JSON.stringify(S));}
}catch(e){}
if(S.gv!==3){S.goals=DEFAULT.goals;S.gv=3;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString("zh-TW");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function fill(){
  $("inE").value=S.e||"";$("inH").value=S.h;$("inC").value=S.c;$("inHr").value=S.hr;$("inCr").value=S.cr;
  [1,2,3].forEach(i=>{const g=S.goals[i-1]||{n:"",m:0};$("goalName"+i).value=g.n;$("goalMiles"+i).value=g.m||""});
}
function render(){
  const hr=Math.max(S.hr,0.01), cr=Math.max(S.cr,1);
  const hMiles=Math.floor(S.h/hr), hLeft=Math.round(S.h-hMiles*hr);
  const units=Math.floor(S.c/cr), cMiles=units*1000, cLeft=S.c-units*cr;
  const e=S.e||0, total=e+hMiles+cMiles;
  $("tMiles").innerHTML=fmt(total)+"<small>哩</small>";
  $("tE").textContent=fmt(e);$("tH").textContent=fmt(hMiles);$("tC").textContent=fmt(cMiles);
  const p=v=>total?v/total*100:0;
  $("tBar").innerHTML=`<i style="width:${p(e)}%;background:var(--jade)"></i><i style="width:${p(hMiles)}%;background:var(--hsbc)"></i><i style="width:${p(cMiles)}%;background:var(--cube)"></i>`;
  $("hRate").textContent=hr+" 點 = 1 哩";
  $("cRate").textContent=fmt(cr)+" 點 = 1,000 哩";
  $("hMiles").innerHTML=fmt(hMiles)+"<small>哩</small>";
  $("cMiles").innerHTML=fmt(cMiles)+"<small>哩</small>";
  $("hLeft").textContent=fmt(hLeft);$("cLeft").textContent=fmt(cLeft);$("cNeed").textContent=fmt(cr-cLeft);
  const gs=S.goals.filter(g=>g.m>0).sort((a,b)=>a.m-b.m);
  const reached=gs.filter(g=>total>=g.m).pop(), next=gs.find(g=>total<g.m);
  const chip=$("tChip");
  if(next){chip.textContent="距「"+next.n+"」差 "+fmt(next.m-total);chip.className="chip warn"}
  else if(reached){chip.textContent="目標全部達成";chip.className="chip ok"}
  else{chip.textContent="未設定目標";chip.className="chip warn"}
  $("goals").innerHTML=gs.map(g=>{
    const pct=Math.min(100,total/g.m*100), gap=Math.max(0,g.m-total);
    const qty=(Math.floor(total/g.m*10)/10).toFixed(1);
    return `<div class="goal${gap?" short":""}"><b>${esc(g.n)} <span class="qty num">${qty} 張</span></b><em class="num">${fmt(total)} / ${fmt(g.m)}</em>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="gap">${gap?`差 ${fmt(gap)} 哩，約需 ${fmt(Math.ceil(gap/1000)*cr)} 小樹點`:"✓ 已可兌換"}</div></div>`;
  }).join("")||`<div class="gap">還沒有目標，點下方「修改目標」設定。</div>`;
  $("saved").textContent=S.example?"範例數字":"已記住";
}
function read(){
  const n=id=>Math.max(0,parseFloat($(id).value)||0);
  S={e:n("inE"),h:n("inH"),c:n("inC"),hr:n("inHr")||1,cr:n("inCr")||360,example:false,gv:3,
     goals:[1,2,3].map(i=>({n:$("goalName"+i).value.trim()||"目標"+i,m:n("goalMiles"+i)}))};
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  render();
}
document.querySelectorAll("input").forEach(el=>el.addEventListener("input",read));
fill();render();
</script>
</body>
</html>
